[package]
name = "trading_challenge_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flutter_rust_bridge = "=2.12.0"
futures-util = "0.3"
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-session = "0.10"
hex = "0.4"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

# The symbol table dominates the shipped library: the macOS universal dylib is
# 56 MB unstripped against a 28 MB Flutter engine, and 37.9 MB stripped. Panic
# backtraces lose function names in return, which costs little here because
# flutter_rust_bridge surfaces panics to Dart as messages, not backtraces.
[profile.release]
strip = "symbols"
