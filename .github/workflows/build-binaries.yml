name: Build desktop binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            runner: ubuntu-latest
            artifact_path: build/linux/x64/release/bundle
          - name: windows
            runner: windows-latest
            artifact_path: build/windows/x64/runner/Release
          - name: macos
            runner: macos-latest
            artifact_path: build/macos/Build/Products/Release/trading_challenge.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libayatana-appindicator3-dev libgtk-3-dev liblzma-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          cargo --version
          rustc --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run Flutter tests
        run: flutter test

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Upload ${{ matrix.platform.name }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: trading-challenge-${{ matrix.platform.name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package release assets
        run: |
          mkdir release
          tar -C dist/trading-challenge-linux -czf release/trading-challenge-linux-x64.tar.gz .
          (
            cd dist
            zip -r ../release/trading-challenge-windows-x64.zip trading-challenge-windows
            zip -r ../release/trading-challenge-macos.zip trading-challenge-macos
          )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
