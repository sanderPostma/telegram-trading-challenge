name: Build desktop binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            runner: ubuntu-latest
            artifact_path: build/linux/x64/release/bundle
          - name: windows
            runner: windows-latest
            artifact_path: build/windows/x64/runner/Release
          # macOS uploads an already-packaged zip, not the .app directory:
          # upload-artifact does not preserve symlinks, and a .app is full of
          # them. See the "Package macOS app" step.
          - name: macos
            runner: macos-latest
            artifact_path: trading-challenge-macos.zip

    # Baked into the binary at compile time as one half of the credential
    # sealing key (see rust/src/secrets.rs), so a published build does not seal
    # credentials with a key that is readable in the source. When the repository
    # secret is absent the value is empty and the build falls back to the
    # in-source default — local builds need no setup and still work.
    env:
      TRADING_CHALLENGE_CREDENTIAL_KEY: ${{ secrets.TRADING_CHALLENGE_CREDENTIAL_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libayatana-appindicator3-dev libgtk-3-dev liblzma-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            installed=false
            for attempt in 1 2 3 4 5; do
              if rustup target add --toolchain stable "$target"; then
                installed=true
                break
              fi
              echo "Rust target download failed for $target (attempt $attempt/5); retrying..."
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "Could not install Rust target $target after 5 attempts." >&2
              exit 1
            fi
          done

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          cargo --version
          rustc --version

      # A release built without the secret falls back to the in-source
      # embedded key (see rust/src/secrets.rs), which is readable by anyone
      # with the repository. That is fine for a local build and not fine for a
      # published binary, and it fails silently — so fail loudly here instead.
      # Only the length is printed; the value itself would be masked anyway.
      - name: Verify credential key is present
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -z "${TRADING_CHALLENGE_CREDENTIAL_KEY:-}" ]; then
            echo "::error::Release build has no TRADING_CHALLENGE_CREDENTIAL_KEY." >&2
            echo "Credentials would be sealed with the public in-source key. Refusing." >&2
            exit 1
          fi
          echo "credential key present (${#TRADING_CHALLENGE_CREDENTIAL_KEY} chars)"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run Flutter tests
        run: flutter test

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `ditto` is the macOS-native archiver: it keeps the framework
          # symlinks (Versions/Current -> A, and the top-level binary alias).
          # Uploading the .app directory instead lets upload-artifact follow
          # those links and store every framework binary three times, which
          # tripled the download and left a bundle that cannot be code-signed.
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/trading_challenge.app \
            trading-challenge-macos.zip
          # Fail loudly if the symlinks ever stop surviving the packaging.
          symlinks=$(zipinfo trading-challenge-macos.zip | grep -c '^l' || true)
          echo "symlink entries in archive: $symlinks"
          if [ "$symlinks" -lt 1 ]; then
            echo "Framework symlinks were not preserved — the bundle is invalid." >&2
            exit 1
          fi
          ls -lh trading-challenge-macos.zip

      - name: Upload ${{ matrix.platform.name }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: trading-challenge-${{ matrix.platform.name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package release assets
        run: |
          mkdir release
          tar -C dist/trading-challenge-linux -czf release/trading-challenge-linux-x64.tar.gz .
          (
            cd dist
            zip -r ../release/trading-challenge-windows-x64.zip trading-challenge-windows
          )
          # The macOS asset was already packaged with `ditto` on the macOS
          # runner. Re-zipping it here would flatten the symlinks again, so it
          # is only moved into place.
          mv dist/trading-challenge-macos/trading-challenge-macos.zip release/trading-challenge-macos.zip
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
