# Telegram message patterns for the Trading Challenge copy-trader.
#
# The application uses this file as its embedded fallback. It also writes a
# copy to the user profile and refreshes that copy from:
# https://telegram-patterns.sander.dnsrouter.nl/telegram_patterns.yaml
#
# Each pattern is tested against the incoming Telegram text. Patterns are
# ordered by match position and then priority. Regexes use Rust regex syntax
# (which has NO lookahead/lookbehind).
#
# Supported actions are enter, add, reduce, close, ignore, and guard. Named
# capture groups can extract btc (BTC quantity), usd (USDT notional), pct
# (reduction percentage), dir (LONG or SHORT), and trigger (limit trigger
# price). Separate instructions joined by AND are evaluated as separate
# actions. For example, "ADDED $5000 AND ADDING $5000 TO LIMIT TRIGGER AT
# 64,300" creates a market add followed by a conditional limit add. A LIMIT
# TRIGGER AT price clause creates a limit order; without it the order is sent
# at market.
#
# PAST-TENSE / HYPOTHETICAL SAFETY. The channel author reports in the past
# tense ("STARTED", "ADDED", "REDUCED", "CLOSED"), so those verbs are real
# signals. But the same words appear in commentary ("I should have added
# $5000", "I think I added $20,000 to the eth trade", "close the trade at
# break-even") that must NEVER trade. Two layers protect against that:
#   1. Trade verbs (STARTED/ADDED/REDUCE(D)/CLOSE) are anchored to the START
#      of a line (^) — real signals are terse commands on their own line,
#      while narrative buries the verb mid-sentence. The one exception is the
#      second half of an "... AND ADDING ..." compound, which is allowed.
#   2. A `guard` action: if any enabled guard regex matches the message, the
#      whole message is treated as discussion and produces NO automated
#      action. This is the "negative match" layer for conditional wording
#      ("should have", "would have", "if I had", "wish I", "imagine",
#      "for example", "what if", "hypothetical").
# Because Rust regex has no lookbehind, guards work at the message level, not
# inline. No genuine signal in the reference channel contains a guard word.
#
# NOT EVERYTHING IS A PATTERN. Take-profit targets are extracted in code
# (`extract_close_target_range`), not from this file: "TP SET 64450",
# "TP: 64450", "TAKE PROFIT SET AT 64450", and "target for full close is
# 63600-63700" place a real TP on WEEX against the open position, whichever
# direction it runs. It carries no size, so the exchange closes the whole
# position at the trigger — including anything added afterwards — with no
# confirmation from the app. A range uses the edge the price reaches first (the
# low for a LONG, the high for a SHORT). With no position, in simulation mode,
# or when WEEX rejects the plan, the target falls back to an app-side watch that
# asks before closing. "TP HIT" is a fill report and is matched by `close`.
#
# When a new Telegram message does not match, give the complete message and
# this file to a browser-based AI assistant such as ChatGPT, Claude, or Gemini.
# Ask it to explain the mismatch and propose a minimal Rust-regex pattern that
# preserves the named capture groups and action semantics above. Test the
# resulting YAML against a real sample before publishing it.

version: 2
patterns:
  # --- Guard: message-level veto for hypothetical / discussion posts. --------
  - name: hypothetical
    regex: '(?i)\b(?:should|would|could)(?:''ve|ve|\s+(?:have|of))\b|\bif\s+i\s+(?:had|would|were)\b|\bwish\s+i\b|\bimagine\b|\bfor\s+(?:example|instance)\b|\bwhat\s+if\b|\bhypothetical'
    action: guard
    priority: 1
    enabled: true
  # --- Trade signals (verb anchored to line start). -------------------------
  # Entry verbs cover both the terse past-tense channel style ("STARTED 0.5BTC
  # SHORT") and the newer scalp style ("OPENING $50000 SCALP BITCOIN LONG",
  # "OPENED $30,000 SCALP SHORT BTC"). entry captures a BTC quantity; entry_usd
  # captures a USD notional. Filler between the amount and the direction is
  # skipped by `.*?`, so the asset may sit on either side of SHORT/LONG.
  - name: entry
    regex: '(?im)^\s*(?:STARTED|OPENING|OPENED)\b.*?(?P<qty>[\d.]+)\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\b.*?\b(?P<dir>SHORT|LONG)\b'
    action: enter
    priority: 10
    enabled: true
  - name: entry_usd
    regex: '(?im)^\s*(?:OPENING|OPENED|STARTED)\b.*?\$(?P<usd>[\d,]+(?:\.\d+)?)(?:\s*(?P<mult>[KM])\b)?.*?\b(?P<dir>SHORT|LONG)\b'
    action: enter
    priority: 11
    enabled: true
  # Shorthand notional without a "$": the k/m suffix is what marks the number as
  # dollars ("opened 20k btc long" = $20,000 of BTC). A bare quantity keeps its
  # BTC reading through the `entry` rule, which wins the tie on priority.
  - name: entry_usd_short
    regex: '(?im)^\s*(?:OPENING|OPENED|STARTED)\b.*?\b(?P<usd>[\d,]+(?:\.\d+)?)\s*(?P<mult>[KM])\b.*?\b(?P<dir>SHORT|LONG)\b'
    action: enter
    priority: 12
    enabled: true
  # Verbless headline entry: "$20,000 BTC LONG FOR CHALLENGE". The amount must
  # open the line and be followed by the asset and a direction, so PnL prose
  # ("$20,000 profit ...") does not open a position. Only an explicit "$" or a
  # k/m suffix marks the number as a notional; a bare "0.5 BTC LONG" headline
  # stays unmatched rather than being read as $0.50.
  - name: entry_verbless
    regex: '(?im)^\s*\$(?P<usd>[\d,]+(?:\.\d+)?)(?:\s*(?P<mult>[KM]))?\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\b[^\n]*?\b(?P<dir>SHORT|LONG)\b'
    action: enter
    priority: 13
    enabled: true
  - name: entry_verbless_short
    regex: '(?im)^\s*(?P<usd>[\d,]+(?:\.\d+)?)\s*(?P<mult>[KM])\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\b[^\n]*?\b(?P<dir>SHORT|LONG)\b'
    action: enter
    priority: 14
    enabled: true
  # Bare quantity headline: "10 ETH LONG". No verb and no "$", so the usual
  # line-start verb anchor cannot protect this rule — the whole line must
  # therefore BE the signal and nothing else. "10 ETH LONG was the right call"
  # is narrative and must not fire, which the trailing $ anchor enforces. The
  # cost is that a genuine signal with a trailing comment stays unmatched; that
  # is the correct direction to fail in an app that submits real orders.
  # See also MAX_SIGNAL_LINES / MAX_SIGNAL_CHARS in rust/src/patterns.rs.
  - name: entry_bare_qty
    regex: '(?im)^\s*(?P<qty>[\d.]+)\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\s+(?P<dir>SHORT|LONG)\s*[.!]?\s*$'
    action: enter
    priority: 15
    enabled: true
  # The "$" is optional so a bare notional ("ADDED 10000") is still a USD add.
  # add_btc has the lower priority number so a bare BTC quantity ("ADDED 0.5
  # BTC") wins the tie against add_usd, which would otherwise read the digits as
  # dollars.
  # Adds also carry the scalp filler ("ADDED $10,000 SCALP SHORT BTC"). Unlike
  # the entry rules this is an explicit word list, not `.*?`: a lazy wildcard
  # here would run past an "... AND ADDING ..." boundary to find a later
  # direction and swallow the second instruction of a compound message. A
  # direction the author states must win — without it the add silently inherits
  # the last remembered side and can be sent against a flipped position.
  - name: add_usd
    regex: '(?im)(?:^|\bAND\s+)\s*ADD(?:ED|ING)\b\s*\$?(?P<usd>[\d,]+(?:\.\d+)?)(?:\s*(?P<mult>[KM])\b)?(?:(?:\s+(?:SCALP|BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH))*\s+(?:TO\s+)?(?P<dir>SHORT|LONG)\b)?(?:\s+TO\s+LIMIT\s+TRIGGER\s+AT\s*\$?(?P<trigger>[\d,]+(?:\.\d+)?))?'
    action: add
    priority: 21
    enabled: true
  - name: add_coin
    regex: '(?im)(?:^|\bAND\s+)\s*ADD(?:ED|ING)\b\s*(?P<qty>[\d.]+)\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\b(?:(?:\s+(?:SCALP|BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH))*\s+(?:TO\s+)?(?P<dir>SHORT|LONG)\b)?(?:\s+TO\s+LIMIT\s+TRIGGER\s+AT\s*\$?(?P<trigger>[\d,]+(?:\.\d+)?))?'
    action: add
    priority: 20
    enabled: true
  # Reduce verbs accept the past tense ("REDUCED"), the bare imperative
  # ("REDUCE") and the scalp gerund ("REDUCING $25000 SCALP BITCOIN LONG").
  - name: reduce_usd
    regex: '(?im)^\s*REDUC(?:E|ED|ING)\b\s*\$(?P<usd>[\d,]+(?:\.\d+)?)(?:\s*(?P<mult>[KM])\b)?'
    action: reduce
    priority: 30
    enabled: true
  - name: reduce_coin
    regex: '(?im)^\s*REDUC(?:E|ED|ING)\b\s*(?P<qty>[\d.]+)\s*(?P<asset>BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\b'
    action: reduce
    priority: 31
    enabled: true
  - name: reduce_pct
    regex: '(?im)^\s*REDUC(?:E|ED|ING)\b.*?(?P<pct>\d+)\s*%'
    action: reduce
    priority: 32
    enabled: true
  # "Taking 50% out of the trade" is a partial reduction. Any trailing dollar
  # figure ("$300 banked") is realized-PnL commentary, not a size.
  - name: reduce_taking_pct
    regex: '(?im)^\s*TAKING\s+(?P<pct>\d+)\s*%\s+OUT\b'
    action: reduce
    priority: 33
    enabled: true
  # Close verbs include the scalp gerund "CLOSING" and "CLOSED ALL TRADES".
  - name: close
    regex: '(?im)^\s*(CLOSED|CLOSING|CLOSE|EXIT|EXITED|FLAT|STOPPED OUT|TP HIT|TOOK PROFIT)\b'
    action: close
    priority: 40
    enabled: true
  # The same exit reported as a plain statement, subject first: "trade closed".
  # The verb is not at the start of the line, so `close` cannot see it, and the
  # line-start anchor is therefore unavailable as a narrative guard here. As
  # with entry_bare_qty, the whole line must BE the signal and nothing else —
  # "the trade closed at a loss yesterday" is commentary and must stay inert.
  # A genuine report with a trailing comment ("trade closed in profit") does
  # not fire; that is the correct direction to fail in. An asset named before
  # the subject ("eth trade closed") routes the close to that book.
  - name: close_subject_first
    regex: '(?im)^\s*(?:(?:THE|ALL|MY)\s+)?(?:(?:BITCOIN|ETHEREUM|ETHER|XBT|BTC|ETH)\s+)?(?:TRADE|TRADES|POSITION|POSITIONS)\s+(?:(?:IS|ARE|NOW|HAS\s+BEEN|HAVE\s+BEEN)\s+)?CLOSED\s*[.!]?\s*$'
    action: close
    priority: 41
    enabled: true
  - name: noop
    regex: '(?i)\b(TRADE UPDATE|CHAT TEST|NOTIFICATIONS|GOOD MORNING)\b'
    action: ignore
    priority: 90
    enabled: true
